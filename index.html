<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParcelGuard | Smart Box</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a1a;
            --grid-color: #333333;
            --text: #f4f4f4;
            --red: #2BCFCE;
            --font: 'Space Grotesk', system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            background: #222222;
        }
        body {
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            font-family: var(--font);
            overflow-x: hidden;
            transition: background 0.35s ease;
        }
        .window {
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            border: 1px solid var(--grid-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            transition: all 0.35s ease;
        }
        .header,
        .main-content,
        .footer,
        .hero,
        .sidebar,
        .nav-links,
        .btn-login,
        .btn-learn,
        .tag,
        .red-star {
            transition: all 0.35s ease;
        }
        
        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem clamp(1rem, 2vw, 2.5rem);
            border-bottom: 1px solid var(--grid-color);
            gap: 1rem;
            flex-wrap: wrap;
        }
        .logo {
            font-weight: 800;
            font-size: clamp(1.1rem, 1.6vw, 1.4rem);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: clamp(0.8rem, 2vw, 2.5rem);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-wrap: wrap;
        }
        .nav-links span { cursor: pointer; transition: color 0.2s; }
        .nav-links span:hover { color: var(--red); }
        .btn-login {
            background: var(--red);
            color: white;
            padding: 0.85rem 1.75rem;
            border: none;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.15s ease, filter 0.2s ease;
        }
        .btn-login:hover { filter: brightness(1.08); }
        .btn-login:active { transform: scale(0.95); }

        /* MAIN HERO AREA */
        .main-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(220px, 400px);
            border-bottom: 1px solid var(--grid-color);
        }
        .hero {
            padding: clamp(2rem, 5vw, 6rem) clamp(1.5rem, 4vw, 5rem);
            border-right: 1px solid var(--grid-color);
            position: relative;
            overflow: hidden;
            min-width: 0;
        }
        h1 {
            font-size: clamp(2.6rem, 5vw, 5.5rem);
            line-height: 1.05;
            margin: 0 0 3.5rem 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1.5px;
            position: relative;
            z-index: 2;
        }
        .highlight {
            position: relative;
            display: inline-block;
            color: white;
            white-space: nowrap;
        }
        .highlight::before {
            content: "";
            position: absolute;
            top: 5%;
            left: -2%;
            width: 104%;
            height: 90%;
            background: var(--red);
            z-index: -1;
        }
        .hl-1::before { transform: rotate(-3deg); }
        .hl-2::before { transform: rotate(2deg); }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 3rem;
            position: relative;
            z-index: 5;
            flex-wrap: wrap;
        }
        .btn-learn {
            background: var(--red);
            color: white;
            border: none;
            padding: 1.25rem 2.5rem;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-watch {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .play-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 1px solid var(--grid-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .btn-watch:hover .play-icon { background: var(--grid-color); }
        .play-icon::after {
            content: "";
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-left: 10px solid white;
            border-bottom: 6px solid transparent;
            margin-left: 4px;
        }

        /* SCATTERED TAGS */
        .tags-container {
            position: absolute;
            bottom: 3rem;
            right: clamp(1rem, 3vw, 5rem);
            width: min(350px, 68%);
            height: 120px;
            z-index: 1;
        }
        .tag {
            position: absolute;
            border: 1px solid #555;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: clamp(0.68rem, 1vw, 0.85rem);
            background: var(--bg);
            color: #ccc;
            font-weight: 600;
            white-space: nowrap;
        }
        .t1 { bottom: 0; left: 0; transform: rotate(-12deg); }
        .t2 { bottom: 40px; left: 40px; transform: rotate(8deg); }
        .t3 { bottom: 10px; left: 130px; transform: rotate(-6deg); }
        .t4 { bottom: 65px; left: 160px; transform: rotate(14deg); }
        .t5 { bottom: 25px; left: 230px; transform: rotate(-16deg); }
        .t6 { bottom: 75px; left: 260px; transform: rotate(10deg); }

        /* RIGHT SIDEBAR GRID/TUNNEL */
        .sidebar {
            background-color: var(--bg);
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            position: relative;
        }
        .sidebar::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 15%, var(--bg) 95%);
        }

        /* FOOTER */
        .footer {
            display: grid;
            grid-template-columns: 1.5fr 1.5fr 1fr;
        }
        .footer-col {
            padding: clamp(1rem, 2vw, 2rem) clamp(1rem, 2vw, 2.5rem);
            display: flex;
            align-items: center;
        }
        .footer-col:not(:last-child) {
            border-right: 1px solid var(--grid-color);
        }
        
        .col-1 { 
            gap: 2rem; 
            font-weight: 800; 
            font-size: clamp(1rem, 1.4vw, 1.25rem);
            letter-spacing: -0.5px;
        }
        .col-1 img { opacity: 0.8; filter: grayscale(1); height: 24px; }
        
        .col-2 { gap: 1.5rem; }
        .avatars { display: flex; }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #444;
            border: 2px solid var(--bg);
            margin-left: -12px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.75rem; 
            font-weight: 700;
        }
        .avatar:first-child { margin-left: 0; background: #6366f1; }
        .avatar:nth-child(2) { background: #ec4899; }
        .avatar:nth-child(3) { background: #14b8a6; }
        .avatar:nth-child(4) { background: #f59e0b; }
        .avatar:nth-child(5) { background: #8b5cf6; }
        
        .col-3 { gap: 1.5rem; font-size: 0.95rem; line-height: 1.5; color: #bbb; }
        .red-star {
            width: 32px;
            height: 32px;
            background: var(--bg);
            border: 2px solid var(--red);
            display: flex; 
            align-items: center; 
            justify-content: center;
            transform: rotate(45deg);
            flex-shrink: 0;
        }
        .red-star::after {
            content: "";
            width: 8px; 
            height: 8px;
            background: var(--red);
            border-radius: 50%;
        }

        @media (max-width: 1100px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .hero {
                border-right: none;
            }
            .footer {
                grid-template-columns: 1fr;
            }
            .footer-col:not(:last-child) {
                border-right: none;
                border-bottom: 1px solid var(--grid-color);
            }
        }

        @media (max-width: 768px) {
            .header {
                align-items: flex-start;
                flex-direction: column;
            }
            .nav-links {
                width: 100%;
                justify-content: flex-start;
            }
            .hero {
                padding-top: 3rem;
                padding-bottom: 8rem;
            }
            .tags-container {
                position: relative;
                right: auto;
                bottom: auto;
                width: 100%;
                height: 130px;
                margin-top: 2rem;
            }
            .tag {
                transform: none !important;
            }
            .col-2 {
                flex-wrap: wrap;
            }
            .col-3 {
                align-items: center;
            }
        }

        @media (max-width: 520px) {
            .header {
                padding: 1rem 1rem 1.25rem;
            }
            .nav-links {
                gap: 0.8rem 1rem;
                font-size: 0.7rem;
            }
            .btn-login {
                width: 100%;
                justify-content: center;
                padding: 0.8rem 1rem;
            }
            .hero {
                padding: 2rem 1rem 4rem;
            }
            h1 {
                margin-bottom: 2rem;
            }
            .footer-col {
                padding: 1rem;
            }
            .col-2 {
                display: block;
            }
            .avatars {
                margin-bottom: 0.75rem;
            }
            .col-3 {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="window">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                ParcelGuard
            </div>
            <div class="nav-links">
                <span>Program</span>
                <span>Hardware</span>
                <span>About</span>
                <button class="btn-login">LOG IN ↗</button>
            </div>
        </div>
        
        <!-- MAIN -->
        <div class="main-content">
            <div class="hero">
                <h1>
                    IOT-BASED<br>
                    <span class="highlight hl-1">SMART PARCEL</span><br>
                    RECEIVING<br>
                    <span class="highlight hl-2">BOX SYSTEM</span>
                </h1>
                
            
                
                <div class="tags-container">
                    <div class="tag t1">ESP-01s</div>
                    <div class="tag t2">Load Cell</div>
                    <div class="tag t3">RFID RC5222</div>
                    <div class="tag t4">Arduino</div>
                    <div class="tag t5">IR Sensor</div>
                    <div class="tag t6">Web Dashboard</div>
                </div>
            </div>
            <div class="sidebar"></div>
        </div>
        
        <!-- FOOTER -->
        <div class="footer">
            <div class="footer-col col-1">
                <span>BSCPE - 4C</span>
            </div>
            <div class="footer-col col-2">
                <div class="avatars">
                    <div class="avatar">BA</div>
                    <div class="avatar">CA</div>
                    <div class="avatar">MA</div>
                    <div class="avatar">PA</div>
                    <div class="avatar">VE</div>
                </div>
                <div>
                    <div style="font-weight: 800; font-size: 1.15rem; color: #fff;">Hardware & Software Team</div>
                    <div style="color: #999; font-size: 0.9rem; margin-top: 0.2rem;">Basa, Carlos, Marquez, Paruli, Ventinilla</div>
                </div>
            </div>
            <div class="footer-col col-3">
                <div class="red-star"></div>
                <div>
                    Real-time delivery monitoring &amp;<br>
                    secure handling for all users
                </div>
            </div>
        </div>
    </div>
</body>
</html>
